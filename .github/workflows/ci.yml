name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: [self-hosted, linux, coinanalyze]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create venv and install dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e '.[dev]'

      - name: Ruff (lint)
        run: |
          . .venv/bin/activate
          ruff check .

      - name: Compile all (syntax check)
        run: |
          . .venv/bin/activate
          python -m compileall -q app

      - name: Pytest
        run: |
          . .venv/bin/activate
          pytest -q

      - name: JavaScript tests
        run: node --test tests/js/
