name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: [self-hosted, linux, coinanalyze]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create venv and install dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e '.[dev]'

      - name: Ruff (lint)
        run: |
          . .venv/bin/activate
          ruff check .

      - name: Compile all (syntax check)
        run: |
          . .venv/bin/activate
          python -m compileall -q app

      # K07 · CABLEADO el 2026-08-27, y con las cifras que lo hicieron posible.
      #
      # LO QUE DECIA ESTE COMENTARIO ANTES ERA CORRECTO EN 08-25 Y HOY YA NO, y merece
      # quedar escrito porque los dos -operador e implementador- afirmamos su diagnostico
      # sin volver a ejecutarlo: decia que 6 de los 8 fallos eran deriva entre schema.sql
      # y app/partitioning.py, o sea sujeto de K16, y por tanto que K16 bloqueaba a K07.
      # MEDIDO HOY, mismo commit: contra una base con schema.sql RECIEN aplicada,
      # test_partitioning_postgres.py pasa ENTERO y la suite da 1372 pasan / 5 fallan.
      # Contra la vieja coinalyze_test fallan 7 de 8. El cerrojo era el ESTADO de esa
      # base reutilizada, no el arbol. K16 NO era prerrequisito de nada.
      #
      # DE AHI LA FORMA DE ABAJO: la base de test NACE Y MUERE CON CADA CORRIDA. Una base
      # reutilizada acumula el esquema de la primera vez que se creo y va derivando en
      # silencio del schema.sql del arbol, hasta que los fallos que produce se leen como
      # defectos del codigo. Es la misma familia que K63: el estado del instrumento
      # disfrazado de veredicto sobre el sujeto.
      #
      # DSN POR SOCKET, no por TCP: los tests de takeover abren una segunda conexion con
      # las credenciales que les da el DSN, y con host TCP piden contrasena y fallan con
      # InvalidPasswordError, que tambien es canal disfrazado de codigo.
      - name: Create disposable test database
        id: testdb
        run: |
          set -eu
          db="ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          createdb --host=/var/run/postgresql "$db"
          echo "db=$db" >> "$GITHUB_OUTPUT"
          psql --host=/var/run/postgresql -d "$db" -q -v ON_ERROR_STOP=1 -f sql/schema.sql

      # EL SUELO SUBE ~220 TESTS DE GOLPE Y ESO NO ES PROGRESO SOBRE NINGUN ROJO VIEJO:
      # es el suelo apareciendo. Los 16 ficheros *_postgres.py llevaban desde siempre sin
      # ejecutarse, asi que la persistencia entera estaba sin vigilar; que ahora cuente no
      # significa que se haya arreglado nada, significa que por fin se mide.
      #
      # LO QUE CUESTA, MEDIDO Y NO ESTIMADO: la suite pasa de ~5 s a 772 s (12:52). Casi
      # todo es sueno de reloj de pared en test_signal_walk_forward_confirmatory_postgres:
      # NO cuelga -eso decia el comentario viejo y es falso-, sino que espera a que el
      # reloj de la base pase la madurez del fold, y esas esperas son DOCE de 48 a 52 s
      # cada una. El tope es un cubo de 60 s por diseno (_wait_past, y el alineado de
      # cubos que lo acota). Bajarlo pide inyectarle el tiempo al modulo, o sea cambiar
      # como lee el reloj: es trabajo acotado y conocido -un helper, doce puntos de
      # llamada- pero NO es un retoque de CI, asi que aqui se paga y se declara.
      - name: Pytest
        env:
          TEST_DATABASE_URL: "postgresql:///${{ steps.testdb.outputs.db }}?host=/var/run/postgresql"
        run: |
          . .venv/bin/activate
          pytest -q

      - name: Drop disposable test database
        if: always() && steps.testdb.outputs.db != ''
        run: dropdb --host=/var/run/postgresql --if-exists "${{ steps.testdb.outputs.db }}"

      - name: JavaScript tests
        run: node --test tests/js/

      # K15 · que un VERDE no vuelva a ROJO en silencio.
      #
      # NO se corre el verify entero, y no es comodidad: este runner ejecuta el codigo
      # de cualquier PR, y los checks de produccion necesitan la clave ssh de 140 y el
      # netrc de la API. Ademas un PR no debe fallar porque 140 tuviera una incidencia,
      # porque eso no lo ha roto el PR. Aqui solo corren los checks cuyo SUJETO es el
      # arbol. Los de produccion los mide el arnes en 143, fuera de este gate.
      #
      # EL SUELO SE DERIVA, NO SE ESCRIBE. La primera version leia un fichero
      # verde-suelo.txt de origin/main con `|| true` y `${suelo:-0}`: ese fichero no
      # existia en main, nadie comprobaba el codigo de retorno, y el gate se apuntaba
      # un suelo de 0 y pasaba EN SILENCIO. Era exactamente el fallo que K15 castiga en
      # los demas -no poder medir y decir que si- y ademas un numero escrito a mano que
      # nada subia, el mismo defecto del que avisa K02. Ahora los dos lados se MIDEN:
      # los mismos checks corren contra el arbol de origin/main y contra el del PR, y
      # se comparan. Dos fuentes distintas, imposible de oxidar.
      #
      # FALLA CERRADO en todos los caminos: si no se puede traer main, si no se puede
      # crear el worktree, o si cualquier check queda en NOMED, el job falla. Un gate
      # que no puede medir no es un gate que pasa.
      - name: Checks del arnes (K15)
        run: |
          set -uo pipefail
          # K31 SALE DE ESTE GATE EL 2026-08-27, por la regla que ya estaba escrita doce
          # lineas mas arriba: aqui solo corren los checks cuyo SUJETO es el arbol.
          # Estaba aqui porque su criterio viejo era un grep sobre static/app.js, o sea
          # TEXTO, y el texto se puede leer sin salir del arbol. Su criterio nuevo mide
          # si la cifra LLEGA A LA PANTALLA ejecutando el panel contra los payloads
          # REALES de produccion, asi que su sujeto ya no es solo el arbol.
          # MEDIDO, no supuesto: harness/secretos/api.netrc es -rw------- de root y el
          # usuario github-runner NO puede leerlo, asi que desde este runner la sonda no
          # captura ni un payload. Y no se arregla abriendo el netrc: dar a un runner
          # que ejecuta el codigo de cualquier PR las credenciales de produccion es una
          # decision de seguridad que no me corresponde tomar a mi.
          # LO QUE SE PIERDE, dicho en vez de disimulado: el gate se queda con UN solo
          # check, K02, que esta ROJO en main y en el PR, o sea que hoy compara 0 con 0
          # y no protege nada. Ya era casi asi -los dos checks de la lista estaban
          # ROJOS-, pero ahora es visible. Ponerle dientes pide meter aqui un check que
          # este VERDE y cuyo sujeto sea el arbol, y eso es alcance del operador.
          # K31 se sigue midiendo en cada verify del arnes en 143, donde SI hay
          # credenciales, y sigue en ROJO con sus 27 rutas.
          CHECKS="harness/checks/K02-cobertura-hueco.sh"
          VENV="$GITHUB_WORKSPACE/.venv/bin/python"

          # GUARDIA 1 · el instrumento tiene que existir ANTES de contar. Un check
          # borrado devuelve 127, y como los DOS conteos ejecutan los scripts del PR,
          # romperlo baja suelo y verde por igual: la comparacion no se entera y un PR
          # que borre un check VERDE pasaria. Se comprueba antes, y se para.
          for c in $CHECKS; do
            [ -r "$GITHUB_WORKSPACE/$c" ] \
              || { echo "::error::falta o no se puede leer $c: el gate no tiene instrumento"; exit 1; }
          done

          git fetch --no-tags --depth=1 origin main \
            || { echo "::error::no se pudo traer origin/main: el gate no puede medir"; exit 1; }
          base=$(mktemp -d)
          git worktree add --detach --force "$base" FETCH_HEAD \
            || { echo "::error::no se pudo crear el worktree de main: el gate no puede medir"; exit 1; }
          trap 'git worktree remove --force "$base" >/dev/null 2>&1 || true' EXIT

          # Cuenta los VERDE de un arbol. Si un check queda en NOMED devuelve 99, que
          # ninguna comparacion puede tomar por buena.
          contar() {
            local arbol="$1" etiqueta="$2" verde=0 nomed=0 rc salida
            for c in $CHECKS; do
              salida=$(REPO="$arbol" VENV_PY="$VENV" bash "$GITHUB_WORKSPACE/$c" 2>&1); rc=$?
              # El detalle va a stderr A PROPOSITO: esta funcion se captura con $(...) y
              # su stdout tiene que ser SOLO el numero. Mezclarlos hacia que la
              # comparacion recibiera texto multilinea, fallara con "integer expression
              # expected" y, sin set -e, el if no entrara: pasaba en silencio. Fallo
              # abierto otra vez, el mismo que este gate existe para castigar.
              printf '  %-22s %-4s rc=%s %s\n' "$(basename "$c" .sh)" "$etiqueta" "$rc" \
                     "$(printf '%s' "$salida" | head -1 | cut -c1-80)" >&2
              # GUARDIA 2 · solo 0/1/2 son veredictos. Cualquier otro rc -127 si el
              # script no existe, 126 si no es ejecutable, 1xx por senal- significa que
              # el check NO ARRANCO, y un check que no arranca no puede medir: cuenta
              # como NOMED, nunca como ROJO.
              case "$rc" in
                0) verde=$((verde+1)) ;;
                1) ;;
                *) nomed=$((nomed+1)) ;;
              esac
            done
            [ "$nomed" -gt 0 ] && { echo "  $etiqueta: $nomed en NOMED" >&2; echo 99; return; }
            echo "$verde"
          }

          suelo=$(contar "$base" main)
          verde=$(contar "$GITHUB_WORKSPACE" PR)
          echo "VERDE: main=$suelo  PR=$verde"

          case "$suelo$verde" in
            *[!0-9]*) echo "::error::el conteo no es numerico (main='$suelo' PR='$verde')"; exit 1 ;;
          esac
          if [ "$suelo" = "99" ] || [ "$verde" = "99" ]; then
            echo "::error::algun check quedo en NOMED: el PR ha roto la capacidad de medir"; exit 1
          fi
          if [ "$verde" -lt "$suelo" ]; then
            echo "::error::los VERDE bajan de $suelo (main) a $verde (PR)"; exit 1
          fi
