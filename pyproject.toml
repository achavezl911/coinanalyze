[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coinalyze-operator-dashboard"
version = "1.5.0"
description = "Dashboard interno de microestructura y scalping para perpetuos BTC, ETH y SOL"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.138.1",
  "uvicorn==0.49.0",
  "asyncpg==0.31.0",
  "httpx==0.28.1",
  "pydantic-settings==2.14.2",
  "websockets==16.0",
  "orjson==3.11.9",
  "tiktoken==0.13.0",
  "tzdata==2026.3; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM105", "SIM117"]
