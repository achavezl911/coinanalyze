limit_conn_zone $binary_remote_addr zone=coinalyze_sse:1m;
limit_req_zone $binary_remote_addr zone=coinalyze_api:1m rate=30r/s;

server {
    listen 8090 default_server;
    listen [::]:8090 default_server;
    server_name _;

    include /etc/nginx/snippets/coinalyze-allowlist.conf;

    return 301 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;
    server_name _;

    include /etc/nginx/snippets/coinalyze-allowlist.conf;

    ssl_certificate /etc/nginx/coinalyze.crt;
    ssl_certificate_key /etc/nginx/coinalyze.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:coinalyze_tls:2m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    auth_basic "Derivatives Operator";
    auth_basic_user_file /etc/nginx/coinalyze.htpasswd;

    client_max_body_size 16k;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location = /api/stream {
        limit_conn coinalyze_sse 4;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Internal-Token __API_INTERNAL_TOKEN__;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
    }

    location / {
        limit_req zone=coinalyze_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Internal-Token __API_INTERNAL_TOKEN__;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
