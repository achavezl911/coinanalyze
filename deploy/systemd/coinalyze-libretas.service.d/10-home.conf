# K49-HOME · 2026-08-28
# Un servicio sin User= corre como root pero con HOME VACIO, y sin HOME git no llega a
# /root/.gitconfig, donde vive el ayudante de credenciales. El fallo era:
#   fatal: could not read Username for 'https://github.com': No such device or address
# INDUCIDO POR LOS DOS LADOS antes de arreglarlo:
#   env -i PATH=... git ls-remote            -> ese mismo fatal
#   env -i PATH=... HOME=/root git ls-remote -> 393de77 refs/heads/main
# NO se usa un ayudante global ni un netrc a proposito: eso pondria la credencial al
# alcance del runner, que ejecuta el codigo de cualquier PR. Declarar HOME=/root NO abre
# esa puerta, y esta MEDIDO: /root es drwx------ y github-runner no puede leer
# /root/.gitconfig ni arrancar esta unit (Access denied).
[Service]
Environment=HOME=/root
